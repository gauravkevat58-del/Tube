name: Build Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=0
          for VAR_NAME in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            VAL="${!VAR_NAME}"
            if [ -z "$VAL" ]; then
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Missing Android release signing secrets. Configure all 4 GitHub Actions repository secrets before running this workflow:"
            echo "  - ANDROID_KEYSTORE_BASE64 (Base64-encoded .jks / .keystore file)"
            echo "  - ANDROID_KEYSTORE_PASSWORD (keystore password)"
            echo "  - ANDROID_KEY_ALIAS (key alias inside the keystore)"
            echo "  - ANDROID_KEY_PASSWORD (key password)"
            echo "Unsigned APKs will not be generated."
            exit 1
          fi

          KEYSTORE_PATH="${{ runner.temp }}/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" \
            | sed '/-----BEGIN.*-----/d;/-----END.*-----/d' \
            | tr -d '\r\n\t ' \
            | base64 -d > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty. Verify ANDROID_KEYSTORE_BASE64 is valid Base64."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Failed to verify keystore with ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi

          ESCAPED_STORE_PASS="${KEYSTORE_PASSWORD//\\/\\\\}"
          ESCAPED_KEY_PASS="${KEY_PASSWORD//\\/\\\\}"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PATH" "$ESCAPED_STORE_PASS" "$KEY_ALIAS" "$ESCAPED_KEY_PASS" > keystore.properties

          echo "Release signing configured and verified."

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify signed release APK
        run: |
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"

          if [ -f "$UNSIGNED_APK" ] && [ ! -f "$SIGNED_APK" ]; then
            echo "::error::Build produced an unsigned APK ($UNSIGNED_APK) instead of a signed release APK."
            exit 1
          fi

          if [ ! -s "$SIGNED_APK" ]; then
            echo "::error::Signed release APK not found or empty at $SIGNED_APK"
            find app/build/outputs/apk -maxdepth 4 -type f || true
            exit 1
          fi

          APKSIGNER_BIN=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --verbose "$SIGNED_APK"
          else
            jarsigner -verify -verbose "$SIGNED_APK" >/dev/null
          fi

          OUT_DIR="${{ runner.temp }}/release-output"
          mkdir -p "$OUT_DIR"
          cp "$SIGNED_APK" "${OUT_DIR}/iTube-Android-TV-Release.apk"
          echo "Verified signed release APK ($(stat -c%s "${OUT_DIR}/iTube-Android-TV-Release.apk") bytes)."

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iTube-Android-TV-Release
          path: ${{ runner.temp }}/release-output/iTube-Android-TV-Release.apk
          if-no-files-found: error

      - name: Clean up temporary signing files
        if: always()
        run: |
          rm -f keystore.properties "${{ runner.temp }}/release.keystore"
